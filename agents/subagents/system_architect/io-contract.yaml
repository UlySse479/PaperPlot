version: 1.0

agent: paperplot-system-architect

schemas:

  input:
    type: object

    task:
      request: string

      task_type:
        - abstraction_design
        - schema_design
        - config_policy
        - override_policy
        - template_design
        - template_registration
        - versioning
        - layer_classification
        - refactor

      target_objects:
        - token
        - theme
        - template
        - spec
        - registry
        - config
        - override
        - version_policy

      current_context:
        existing_tokens: []
        existing_themes: []
        existing_templates: []
        existing_specs: []
        existing_registry_rules: []

      constraints:
        explicit: []
        implicit: []

      expected_outputs:
        - schema
        - policy
        - config
        - registry_entry
        - template_definition
        - classification_decision

      quality_requirements:
        consistency: true
        extensibility: true
        reusability: true
        explicitness: true
          user_request:
            type: string

          interpreted_goal:
            type: string

          task_type:
            type: string
            enum: [design, implementation, refactor, debug, extension, testing, documentation]

          architecture_layer:
            type: string
            enum: [policy, schema, token, theme, template, chart, composition, rendering, export, validation, testing, docs]

          modules:
            type: array
            items:
              type: string

          constraints:
            type: object
            properties:
              explicit:
                type: array
                items: { type: string }
              implicit:
                type: array
                items: { type: string }

  output:
    type: object

    analysis:
      request_understanding: ""
      problem_type: ""
      target_layer: ""
      owned_scope: []
      out_of_scope: []

    decision:
      chosen_abstraction: ""
      alternatives_considered: []
      rationale: ""

    design:
      schema_changes: []
      policy_changes: []
      template_changes: []
      registry_changes: []

    override_rules:
      allowed: []
      forbidden: []
      precedence: []

    versioning:
      impact_level: none | patch | minor | major
      compatibility: backward | partial | breaking
      migration_needed: true | false

    guardrail_check:
      abstraction_leakage: false
      duplicated_responsibility: false
      uncontrolled_override: false
      template_fragmentation: false

    handoff:
      next_agent: ""
      implementation_notes: []
          analysis:
            type: object
            properties:
              task_understanding: { type: string }
              phase: { type: string }
              architecture_layer: { type: string }
              modules:
                type: array
                items: { type: string }

          plan:
            type: object
            properties:
              strategy: { type: string }
              subagents:
                type: array
                items: { type: string }
              skills:
                type: array
                items: { type: string }

          result:
            type: object
            properties:
              artifacts:
                type: array
                items: { type: string }

          testing:
            type: object
            properties:
              method: { type: string }
              status:
                type: string
                enum: [pass, fail]
              notes: { type: string }