[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperplot"
version = "0.1.0"
description = "A Matplotlib-based framework for consistent, publication-quality scientific figures."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
]

[project.scripts]
paperplot = "paperplot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["paperplot*"]
exclude = ["artifacts*", "docs*", "examples*", "scripts*", "tests*"]
