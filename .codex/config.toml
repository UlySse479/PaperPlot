# =========================
# PaperPlot Codex Config
# =========================

# Project root detection
project_root = "."

# =========================
# Default model behavior
# =========================

[models]
default = "gpt-5.4"
lightweight = "gpt-5.4-mini"

# =========================
# Agent configuration
# =========================

[agents]

# Default entry agent
default = "paperplot-lead"

# Explicit agent registry
available = [
  "paperplot-lead",
  "system-architect",
  "rendering-agent",
  "quality"
]

# =========================
# Agent routing hints
# (soft constraints, not hard rules)
# =========================

[routing]

# System / architecture related
system_keywords = [
  "architecture",
  "design",
  "token",
  "theme",
  "template",
  "spec",
  "config",
  "registry",
  "abstraction",
  "refactor structure"
]

# Rendering related
rendering_keywords = [
  "plot",
  "draw",
  "matplotlib",
  "figure",
  "layout",
  "axes",
  "legend",
  "ticks",
  "render",
  "export"
]

# Quality related
quality_keywords = [
  "test",
  "regression",
  "visual",
  "baseline",
  "quality",
  "review",
  "example",
  "documentation",
  "readability",
  "paper-ready"
]

# =========================
# Skills configuration
# =========================

[skills]

enabled = true

# Local skills directory
paths = [
  ".codex/skills"
]

# Allow implicit skill triggering
auto_invoke = true

# =========================
# Skill routing hints
# =========================

[skills.routing]

paper_figure_rules = [
  "improve figure",
  "make it publication",
  "paper quality",
  "looks better",
  "visual quality",
  "readability"
]

plot_regression_playbook = [
  "regression",
  "baseline",
  "compare figures",
  "visual diff",
  "did this change",
  "unexpected change"
]

# =========================
# Execution policy
# =========================

[execution]

# Allow subagent delegation
allow_delegation = true

# Prefer minimal plan before execution
require_plan = false

# Limit unnecessary agent fan-out
max_active_agents = 2

# =========================
# Output control
# =========================

[output]

# Prefer concise, structured output
style = "concise-structured"

# Avoid verbose explanations unless needed
verbosity = "adaptive"

# =========================
# Safety & discipline
# =========================

[constraints]

# Enforce architectural separation
enforce_layer_boundaries = true

# Prevent ad-hoc parameter injection
no_ad_hoc_style = true

# Prefer reuse over one-off logic
prefer_reuse = true

# =========================
# Debug / development
# =========================

[debug]

# Show which agent handled the task
show_agent = true

# Show skill usage (for tuning)
show_skills = true

# Log routing decisions (optional)
log_routing = false